[project]
name = "phoenix"
version = "0.1.0"
description = "Transsion firmware client for phoenixservicetool.com"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.32.0",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.scripts]
phoenix = "phoenix.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
